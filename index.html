<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2e9d9"><title>芽伴 · 专注计时与成长</title><style>
:root{--bg:#f2e9d9;--ink:#28342b;--muted:#758174;--green:#526e51;--mint:#d4e3bd;--orange:#df9a62;--line:#d7d1c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}button,input{font:inherit}.shell{max-width:1060px;margin:auto;padding:0 28px}.top{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:22px;font-weight:850;letter-spacing:-.05em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.2em;font-weight:500}.day{color:var(--muted);font-size:12px}.intro{padding:45px 0 30px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--green);font-weight:800}.intro h1{font-size:clamp(37px,5vw,60px);line-height:1.12;letter-spacing:-.06em;margin:10px 0}.intro p{color:var(--muted);margin:0}.main{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.focus,.garden{border-radius:20px;padding:24px;background:#fffaf0;border:1px solid var(--line)}.focus{min-height:485px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.pet{width:180px;height:180px;border-radius:52% 48% 45% 55%;background:var(--mint);display:grid;place-items:center;font-size:98px;position:relative;box-shadow:inset -12px -12px 0 #b9cea1;transition:.3s}.pet.focused{transform:translateY(-8px) rotate(-3deg);box-shadow:0 16px 35px #78895a30,inset -12px -12px 0 #b9cea1}.pet.sleep{filter:saturate(.5)}.pet:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff7;top:24px;right:32px}.petname{margin:15px 0 0;font-size:14px;font-weight:700}.petxp{width:min(290px,90%);height:7px;background:#e6e1d5;border-radius:99px;margin:10px auto 18px;overflow:hidden}.petxp i{display:block;height:100%;width:20%;background:var(--green);border-radius:99px;transition:.4s}.timer{font-variant-numeric:tabular-nums;font-size:64px;font-weight:700;letter-spacing:-.06em;line-height:1}.mode{font-size:12px;color:var(--muted);margin:8px}.controls{display:flex;gap:9px;margin-top:18px}.btn{border:1px solid var(--line);border-radius:99px;padding:11px 17px;background:transparent;color:var(--ink)}.btn.primary{background:var(--green);border-color:var(--green);color:white;padding-inline:25px}.btn:hover{transform:translateY(-1px)}.garden h2{font-size:23px;margin:0}.garden .sub{margin:3px 0 15px;font-size:12px;color:var(--muted)}.task{display:flex;gap:9px;margin:12px 0}.task input{flex:1;border:1px solid var(--line);padding:11px;border-radius:10px;background:#fff}.task button{border:0;border-radius:10px;background:var(--green);color:white;padding:0 14px}.tasklist{display:grid;gap:7px;max-height:190px;overflow:auto}.taskitem{background:#f5f1e8;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:13px}.taskitem.done{text-decoration:line-through;color:#98a093}.taskitem button{border:0;background:none;color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.stat{background:#f5f1e8;padding:14px;border-radius:12px}.stat b{display:block;font-size:22px}.stat small{color:var(--muted)}.tip{font-size:12px;color:var(--muted);line-height:1.7;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.foot{padding:22px 0;color:var(--muted);font-size:11px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:10px 16px;border-radius:99px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:730px){.shell{padding:0 16px}.main{grid-template-columns:1fr}.focus{min-height:410px}.pet{width:145px;height:145px;font-size:78px}.timer{font-size:56px}}
</style></head><body><div class="shell"><header class="top"><div class="brand">芽伴<small>MORI · FOCUS GARDEN</small></div><div class="day" id="date"></div></header><section class="intro"><div class="eyebrow">把专注，变成一段共同成长</div><h1>今天也陪你，<br>慢慢长大。</h1><p>选一件小事，开始一段专注时间。芽芽会一直陪着你。</p></section><main class="main"><section class="focus"><div class="pet" id="pet">🌱</div><div class="petname" id="petname">芽芽 · 第 1 阶段</div><div class="petxp"><i id="xpbar"></i></div><div class="timer" id="timer">25:00</div><div class="mode" id="mode">专注时间 · 25 分钟</div><div class="controls"><button class="btn" id="reset">重新开始</button><button class="btn primary" id="toggle">开始专注</button><button class="btn" id="switch">休息 5 分钟</button></div></section><aside class="garden"><h2>今天的小目标</h2><p class="sub">写下来，芽芽帮你记着。</p><form class="task" id="taskform"><input id="taskinput" placeholder="例如：整理完读书笔记"><button>添加</button></form><div class="tasklist" id="tasks"></div><div class="stats"><div class="stat"><b id="sessions">0</b><small>次专注完成</small></div><div class="stat"><b><span id="minutes">0</span> 分</b><small>累计投入时间</small></div></div><p class="tip">每完成一段专注，芽芽就会获得成长能量。长时间离开页面时，计时会自动暂停，记得回来继续。</p></aside></main><footer class="foot">芽伴 · 专注数据保存在当前浏览器中。</footer></div><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s);let state=JSON.parse(localStorage.moriFocus||'null')||{seconds:1500,mode:'focus',running:false,sessions:0,minutes:0,xp:0,tasks:[]};let timer=null;function persist(){localStorage.moriFocus=JSON.stringify(state);render()}function render(){let m=Math.floor(state.seconds/60),s=state.seconds%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;$('#mode').textContent=state.mode==='focus'?'专注时间 · 25 分钟':'休息时间 · 5 分钟';$('#toggle').textContent=state.running?'暂停一下':'开始专注';$('#pet').className='pet '+(state.running?'focused':'');let level=Math.floor(state.xp/4)+1,emojis=['🌱','🌿','🪴','🌳','🌸'];$('#pet').textContent=emojis[Math.min(level-1,4)];$('#petname').textContent=`芽芽 · 第 ${level} 阶段`;$('#xpbar').style.width=`${(state.xp%4)*25|| (state.xp?100:12)}%`;$('#sessions').textContent=state.sessions;$('#minutes').textContent=state.minutes;$('#tasks').innerHTML=state.tasks.length?state.tasks.map((t,i)=>`<div class="taskitem ${t.done?'done':''}"><span><input type="checkbox" data-check="${i}" ${t.done?'checked':''}> ${esc(t.text)}</span><button data-remove="${i}">×</button></div>`).join(''):'<div style="color:var(--muted);font-size:13px;padding:13px">暂时没有目标。写下一件今天想完成的事吧。</div>';document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{state.tasks[+x.dataset.check].done=x.checked;persist()});document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{state.tasks.splice(+x.dataset.remove,1);persist()})}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tick(){if(!state.running)return;state.seconds--;if(state.seconds<=0){state.running=false;clearInterval(timer);if(state.mode==='focus'){state.sessions++;state.minutes+=25;state.xp++;state.mode='break';state.seconds=300;$('#toast').textContent='这一段完成啦，芽芽长大了一点 🌿'}else{state.mode='focus';state.seconds=1500;$('#toast').textContent='休息结束，准备好下一段了吗？'}$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2600)}persist()}$('#toggle').onclick=()=>{state.running=!state.running;if(state.running)timer=setInterval(tick,1000);else clearInterval(timer);persist()};$('#reset').onclick=()=>{state.running=false;clearInterval(timer);state.seconds=state.mode==='focus'?1500:300;persist()};$('#switch').onclick=()=>{state.running=false;clearInterval(timer);state.mode=state.mode==='focus'?'break':'focus';state.seconds=state.mode==='focus'?1500:300;persist()};$('#taskform').onsubmit=e=>{e.preventDefault();let v=$('#taskinput').value.trim();if(v){state.tasks.push({text:v,done:false});$('#taskinput').value='';persist()}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.running){state.running=false;clearInterval(timer);persist()}});$('#date').textContent=new Intl.DateTimeFormat('zh-CN',{dateStyle:'full'}).format(new Date());render();</script></body></html>
